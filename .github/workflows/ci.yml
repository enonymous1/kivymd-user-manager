name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (model and database)
        run: mypy user_management
      - name: Tests (headless; GUI smoke test stays opt-in)
        run: python -m pytest tests -q
